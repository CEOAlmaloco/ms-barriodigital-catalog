server:
  port: 8082
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

spring:
  application:
    name: ms-barriodigital-catalog
  config:
    import: optional:file:.env[.properties]
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Solo kafka-admin crea topics. Catalog no declara NewTopic.
    admin:
      auto-create: false
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  datasource:
    url: ${ORACLE_URL}
    username: ${ORACLE_USER}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: barriodigital-catalog-oracle
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      data-source-properties:
        oracle.net.tns_admin: ${ORACLE_WALLET_DIR}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

barriodigital:
  outbox:
    relay-delay-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true
    # Kafka caído no tumba el health: los eventos esperan en el outbox.
    kafka:
      enabled: false
