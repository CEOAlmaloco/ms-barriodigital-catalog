openapi: 3.0.3
info:
  title: ms-barriodigital-catalog
  version: 1.0.0
servers:
  - url: /
paths:
  /api/catalog/procedures:
    get:
      operationId: list
      responses:
        '200':
          description: OK
    post:
      operationId: create
      responses:
        '200':
          description: OK
  /api/catalog/procedures/{value}:
    put:
      operationId: update
      responses:
        '200':
          description: OK
  /api/catalog/procedures/{value}/reserve:
    post:
      operationId: reserve
      responses:
        '200':
          description: OK
  /api/catalog/procedures/{value}/release:
    post:
      operationId: release
      responses:
        '200':
          description: OK
